<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' file: 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>{{MOCK_ID}} — {{MOCK_NAME}}</title>
<link rel="stylesheet" href="wireframe.css">
</head>
<body data-mock-id="{{MOCK_ID}}">
{{SCREENS}}
<script>
(function () {
  function show(id) {
    document.querySelectorAll('.wf-screen').forEach(function (s) { s.classList.remove('is-active'); });
    var el = document.querySelector('[data-screen="' + id + '"]');
    if (el) el.classList.add('is-active');
    window.scrollTo(0, 0);
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-goto]');
    if (t) { e.preventDefault(); show(t.getAttribute('data-goto')); }
  });
  var first = document.querySelector('.wf-screen');
  if (first) first.classList.add('is-active');
})();
</script>
</body>
</html>
